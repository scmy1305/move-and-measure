<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move &amp; Measure</title>
<style>
  :root { color-scheme: light dark; --bg: #F5F7FA; --text: #142033; --muted: #526176; --accent: #526800; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101827; --text: #F4F7FC; --muted: #B8C7DD; --accent: #D5F36B; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 4rem 1.25rem; }
  .mark { font-weight: 900; font-size: 2.5rem; letter-spacing: -0.12em; }
  .mark span { color: var(--accent); }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-label="Move and Measure">M<span>M</span></div>
  <h1>Move &amp; Measure</h1>
  <p>A training log for kettlebells and strength: rest timing, weekly volume per exercise, and your progress over time. For iPhone.</p>
  <p>Your workouts stay on your iPhone. Privacy policy and support pages are coming soon.</p>
</main>
</body>
</html>
